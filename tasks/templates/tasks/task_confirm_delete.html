{% extends 'base.html' %}

{% block title %}Удалить задачу? &middot; {{ block.super }}{% endblock %}

{% block content %}
<div class="panel panel-narrow mx-auto border-danger">
  <div class="panel-head"><h1 class="h5 mb-0">Удалить задачу?</h1></div>
  <div class="panel-body">
    <p class="wrap-any"><strong>{{ task.title }}</strong></p>
    <p class="meta">Задача исчезнет безвозвратно. Если она просто сделана, отметьте её выполненной.</p>
    <form method="post" class="mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger btn-block mb-2">Да, удалить</button>
      <a class="btn btn-outline-secondary btn-block" href="{% url 'tasks:detail' task.pk %}">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
