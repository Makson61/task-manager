# Бесплатный Render усыпляет сервис после 15 минут без запросов, и первое
# открытие после сна занимает около 30 секунд. Этот workflow открывает
# /healthz/ каждые 10 минут по будням с 8:00 до 17:00 по Москве, чтобы днём
# сайт открывался сразу. Круглосуточно будить нельзя: на аккаунт даётся
# 750 бесплатных часов в месяц на все сервисы. Адрес /healthz/ не обращается
# к базе данных, поэтому база в простое засыпает и не тратит свой лимит.
name: keepalive

on:
  schedule:
    - cron: "*/10 5-13 * * 1-5"   # время UTC = московское минус 3 часа
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://makson-task-manager.onrender.com/healthz/
