{% extends 'base.html' %}

{% block title %}Страница не найдена &middot; {{ block.super }}{% endblock %}

{% block content %}
<div class="notice text-center">
  <div class="notice-icon">404</div>
  <h1 class="h4">Такой страницы нет</h1>
  <p class="text-muted mb-4">Страница удалена, адрес набран с ошибкой или эти данные принадлежат другому пользователю.</p>
  <a class="btn btn-accent" href="/">На главную</a>
</div>
{% endblock %}
